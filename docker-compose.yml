services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ffl
      POSTGRES_PASSWORD: ffl
      POSTGRES_DB: ffl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffl"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn ffl.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://ffl:ffl@db:5432/ffl
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  pgdata:
