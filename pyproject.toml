[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ffl"
version = "0.1.0"
description = "US Federal Firearm License data service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "geoalchemy2>=0.17.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "censusgeocode>=0.5.0",
    "mcp>=1.7.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
]

[project.scripts]
ffl-ingest = "scripts.ingest:main"
ffl-api = "ffl.api.main:run"
ffl-mcp = "ffl.mcp_server.server:run"
ffl-geo-seed = "ffl.ingestion.geo_seeder:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ffl", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.envs.default]
python = "3.11"
